name: CI

# R11: three-OS matrix × Node 22 LTS, plus the lockfile-drift, license, i18n,
# Trellis-immutability gates, and (offline job) the M5-sweep full-offline gate.
# R2 forbids CI reading or writing `.trellis/`,
# `.claude/`, `.codex/`, `.qoder/`, `.agents/`, or `AGENTS.md` — no step below
# references any of them except the guard that asserts they were not modified.

on:
  push:
    # m5-residuals-ci is the M5-sweep iteration branch for the full-offline
    # gate (AC2); drop it from this list when the sweep merges to master.
    branches: [main, master, m5-residuals-ci]
  pull_request:
  # Manual runs, so a gate can be exercised without inventing a commit.
  workflow_dispatch:

# A force-push or a second push to the same PR makes the older run's answer
# irrelevant. Cancel it rather than paying for it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: nothing here writes to the repo, opens issues, or publishes.
permissions:
  contents: read

env:
  # Playwright and `forbidOnly` in playwright.config.ts branch on this.
  CI: 'true'

jobs:
  # Gates that are identical on every OS. Run once rather than three times: a
  # license set and a JSON catalogue do not vary by platform, and a matrix would
  # triple the cost while reporting the same answer.
  once:
    name: Repo gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # `--frozen-lockfile` IS the lockfile-drift check R11 asks for: it fails if
      # pnpm-lock.yaml disagrees with any package.json. A separate diff step would
      # be a second, weaker spelling of the same assertion.
      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Dependency licenses (D4)
        run: pnpm check:licenses

      - name: i18n completeness (R10, A12)
        run: pnpm check:i18n

      - name: Format
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      # One platform's failure is information about that platform, not a reason to
      # stop learning what the others do. A Windows-only path bug should not hide
      # a macOS-only one in the same run.
      fail-fast: false
      matrix:
        # macos-latest is arm64, which R11 requires: the Electron and KataGo
        # binaries differ by architecture, so an x64-only run would not test what
        # ships to Apple Silicon.
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      # The KataGo engine + net are downloaded executables, not npm packages, so
      # the lockfile cannot pin them; scripts/katago-manifest.ts pins version,
      # per-platform asset, and (TOFU) sha256 instead. We cache the fetched
      # payload keyed by the manifest's git blob hash — content-addressed, so
      # bumping the manifest (new version/net) invalidates the cache, while an
      # unrelated commit reuses it. Without the cache each of the three matrix
      # runs would re-download ~50MB (engine zip + net). Since M5 the darwin
      # payload is the CI source build published to this repo's katago-v1.18.1
      # release — fetched through the same chain, cached the same way.
      - name: Restore KataGo engine + weights
        id: katago-cache
        uses: actions/cache@v4
        with:
          path: apps/desktop/resources
          key: katago-${{ runner.os }}-${{ hashFiles('scripts/katago-manifest.ts') }}

      # The fetch fails loudly if the source is unreachable — a zero exit must
      # mean "present and verified", never "silently skipped". Platforms with
      # no engine target (none in the current matrix) exit 0 by design.
      - name: Fetch KataGo engine + weights
        run: |
          pnpm fetch:katago
          pnpm fetch:weights

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit and integration tests
        run: pnpm test

      # R12: "Every gate from Stage 5 on must build and launch out/." The build is
      # a precondition of the e2e suite, kept as its own step so a build failure
      # reads as a build failure rather than as a test failure.
      - name: Build
        run: pnpm build

      # Electron needs an X server on Linux and there is none on a headless
      # runner. `xvfb-run` supplies one; the other two platforms launch directly.
      # Without this the Linux e2e job fails at launch with an error about DISPLAY,
      # which looks like an app defect and is not.
      - name: End-to-end (Linux, headless display)
        if: runner.os == 'Linux'
        run: xvfb-run --auto-servernum pnpm e2e -- --reporter=github

      - name: End-to-end
        if: runner.os != 'Linux'
        run: pnpm e2e -- --reporter=github

      # Unsigned package, per R11. Signing needs secrets that a PR from a fork
      # must never see, and an unsigned artifact still answers the question this
      # step exists for: does packaging succeed on this OS.
      - name: Package (unsigned)
        run: pnpm package

      # The packaged-launch gate (B1): the `win-unpacked` / `linux-unpacked`
      # app must reach `ready` against the real bundled KataGo and land a real
      # analysis readout — the assertion that only a packaged build can make,
      # because it exercises the `extraResources` layout `locate.ts` resolves
      # in packaged mode. Skips itself on macOS (no engine asset, no
      # `<platform>-unpacked` dir) and whenever no package exists, so it is
      # safe to run unconditionally after packaging.
      - name: Packaged launch gate (Linux, headless display)
        if: runner.os == 'Linux'
        run: xvfb-run --auto-servernum pnpm --filter @gomentor/desktop exec playwright test packaged-launch

      - name: Packaged launch gate
        if: runner.os == 'Windows'
        run: pnpm --filter @gomentor/desktop exec playwright test packaged-launch

      # macOS runs the same spec against the real CI-built darwin engine
      # (source-build asset, M5): the packaged .app must reach `ready` and land
      # a real readout, proving the darwin `extraResources` layout the same way
      # the win/linux runs prove theirs. First-run Metal shader compilation is
      # why this gate allows the darwin branch its 90s ready timeout.
      - name: Packaged launch gate
        if: runner.os == 'macOS'
        run: pnpm --filter @gomentor/desktop exec playwright test packaged-launch

      # R2's hard boundary, and it must be the last `run` step, after packaging.
      # It asserts that nothing above — install, typecheck, test, build, e2e,
      # package — wrote to the agent directories. Placed before `pnpm package` it
      # would say nothing about the step most likely to write stray files, which
      # is exactly the mistake this comment replaced.
      #
      # `pnpm check:trellis` is `git diff --exit-code` over the six paths. Proven
      # to fail rather than assumed: appending one line to a file under
      # `.trellis/` exits 1, and reverting it returns to 0.
      - name: Trellis immutability (R2)
        run: pnpm check:trellis

      - name: Upload artifacts
        # Runs even when an earlier step failed: a packaging or e2e failure is
        # exactly when the built output is worth inspecting.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gomentor-${{ matrix.os }}
          # `dist/` is electron-builder's output. `if-no-files-found: ignore`
          # rather than `error`, because this runs with `always()` and a failure
          # before packaging legitimately leaves nothing to upload — erroring
          # there would replace the real failure with a misleading one.
          path: apps/desktop/dist
          if-no-files-found: ignore
          retention-days: 7

  # --- M5 residual R2: the full-offline gate ---------------------------------
  #
  # Claim under test: once engine and weights are present, the app runs fully
  # offline — structural, not incidental. So this job installs and fetches WITH
  # network, then severs every outbound path (loopback exempt) and re-runs the
  # gates (typecheck, test, build, e2e) inside the cut.
  #
  # Why a user+net namespace and not iptables: the runner agent keeps its own
  # outbound connection to the Actions service; dropping the machine's OUTPUT
  # chain would hang the job's reporter. `unshare --net --map-root-user` puts
  # the TEST TREE in a private namespace while the reporter lives outside it.
  # `--map-root-user` keeps env, HOME, and PATH identical (no sudo inside the
  # gates, no root store paths) and the mapped root holds CAP_NET_ADMIN over
  # the namespace's devices — which `ip link set lo up` needs, because a new
  # namespace starts with lo DOWN and Playwright talks to Electron over
  # 127.0.0.1. Without `lo up`, e2e dies for an environmental reason and reads
  # as an app defect.
  #
  # The trap is two-sided (a gate that cannot fail is not a gate):
  #   pre-sever  — the probe curl MUST succeed, proving the job really had
  #                network to lose (the fetch step above already required it;
  #                this probe makes the proof local and explicit);
  #   post-sever — the same curl inside the namespace MUST fail; success means
  #                the sever leaked, and the job fails.
  #
  # Why each gate survives the cut (checked, not assumed): install and both
  # fetches run BEFORE the sever; Playwright drives the built Electron binary
  # (no browser download); the suite's live-probe tests self-skip offline; and
  # Electron's children inherit the namespace while KataGo speaks stdio.
  #
  # Fallback ladder if a future runner image blocks unshare, in order:
  #   (a) re-enable unprivileged userns creation for this run with
  #       `sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0`,
  #       then the identical namespace command — ubuntu-24.04 runner images
  #       ship the AppArmor restriction on, and the step below implements
  #       rungs (a) and (b) automatically, logging which rung executed;
  #   (b) `sudo env HOME=$HOME PATH=$PATH unshare --net` — as real root the
  #       net namespace needs no user namespace, so the AppArmor restriction
  #       does not apply; env is preserved explicitly so pnpm's store and
  #       PATH resolve identically;
  #   (c) env-scoped dead-proxy poisoning (HTTPS_PROXY=http://127.0.0.1:9) —
  #       WEAKER: undici fetches ignore proxy env, so it asserts only
  #       proxy-aware callers; a job taking this rung must record why;
  #   (d) fail the job loudly rather than silently downgrade the claim.
  # Every rung emits ::notice::/::error:: workflow commands, so the chosen
  # rung and any failure are readable from the run's annotations.
  # One OS (ubuntu) is enough: the claim is platform-agnostic, and one OS
  # keeps the cost flat — the same rationale as the `once` job.
  offline:
    name: Full-offline gates
    runs-on: ubuntu-latest
    env:
      # The host `pnpm install` proved reachable moments earlier; a registry
      # HEAD is the lightest probe that exercises DNS + TCP + TLS together.
      OFFLINE_PROBE_URL: https://registry.npmjs.org
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      # Same content-addressed cache as the `test` job: the engine and net are
      # downloaded payloads pinned by scripts/katago-manifest.ts, and the
      # fetch below fails loudly if a cache miss cannot reach the source.
      - name: Restore KataGo engine + weights
        id: katago-cache
        uses: actions/cache@v4
        with:
          path: apps/desktop/resources
          key: katago-${{ runner.os }}-${{ hashFiles('scripts/katago-manifest.ts') }}

      # Runs with full network: this is the "once present" half of the claim.
      - name: Fetch KataGo engine + weights
        run: |
          pnpm fetch:katago
          pnpm fetch:weights

      # Vacuity arm of the two-sided trap: if this curl fails, the job fails
      # BEFORE the sever — a post-sever failure would then prove nothing.
      - name: Pre-sever probe (network MUST be reachable)
        run: curl -fsSI --max-time 20 "$OFFLINE_PROBE_URL"

      # Assertion arm: the same probe inside the namespace MUST now fail.
      # Mechanism selection is loud by design — every rung emits workflow
      # notices/errors so the chosen rung and the trap outcome are visible in
      # the run's annotations without opening the job log.
      - name: Full-offline gates (severed network namespace)
        run: |
          INNER='
            set -e
            ip link set lo up
            if curl -fsSI --max-time 20 "$OFFLINE_PROBE_URL" >/dev/null 2>&1; then
              echo "::error::OFFLINE GATE FAILED: probe still reachable inside the severed namespace"
              exit 1
            fi
            echo "OFFLINE GATE: probe unreachable inside the namespace — sever holds"
            echo "::notice::OFFLINE GATE trap: post-sever probe failed as required (sever holds)"
            echo "::notice::OFFLINE GATE: starting typecheck"
            pnpm typecheck
            echo "::notice::OFFLINE GATE: starting test"
            pnpm test
            echo "::notice::OFFLINE GATE: starting build"
            pnpm build
            echo "::notice::OFFLINE GATE: starting e2e"
            xvfb-run --auto-servernum pnpm e2e -- --reporter=github
            echo "::notice::OFFLINE GATE: e2e passed offline — all gates green"
          '
          run_gates() { unshare --net --map-root-user -- sh -c "$INNER"; }

          echo "::notice::OFFLINE GATE: unshare at $(command -v unshare || echo MISSING)"
          if unshare --net --map-root-user -- sh -c "ip link set lo up" 2>/tmp/rung0.err; then
            echo "::notice::OFFLINE GATE: rung 0 (unprivileged user+net namespace) available"
            run_gates
            exit $?
          fi
          echo "::error::OFFLINE GATE: rung 0 blocked: $(cat /tmp/rung0.err)"

          if sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 2>/tmp/runga.err; then
            echo "::notice::OFFLINE GATE: rung a — re-enabled unprivileged userns via sudo sysctl"
            if unshare --net --map-root-user -- sh -c "ip link set lo up" 2>/tmp/runga2.err; then
              run_gates
              exit $?
            fi
            echo "::error::OFFLINE GATE: rung a still blocked after sysctl: $(cat /tmp/runga2.err)"
          else
            echo "::error::OFFLINE GATE: rung a sysctl failed: $(cat /tmp/runga.err)"
          fi

          if sudo env "HOME=$HOME" "PATH=$PATH" "CI=$CI" unshare --net -- sh -c "ip link set lo up" 2>/tmp/rungb.err; then
            echo "::notice::OFFLINE GATE: rung b — sudo namespace with env preserved explicitly"
            sudo env "HOME=$HOME" "PATH=$PATH" "CI=$CI" unshare --net -- sh -c "$INNER"
            exit $?
          fi
          echo "::error::OFFLINE GATE: rung b failed: $(cat /tmp/rungb.err)"

          echo "::error::OFFLINE GATE: every namespace rung unavailable — failing loudly (ladder rung d)"
          exit 1

      # The gates step tees its full output to /tmp/step9.log; uploading it
      # keeps the exact failure (including a silent launch failure) inspectable
      # from the artifact even when annotations carry no detail.
      - name: Upload offline-gate diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: offline-gate-diagnostics
          path: |
            /tmp/step9.log
            /tmp/gate-*.log
            /tmp/rung*.err
          if-no-files-found: ignore
          retention-days: 1
